<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131318">
<title>瞬間英作文</title>
<style>
:root{
  color-scheme:dark;
  --bg:#131318;
  --surface:#1C1B22;
  --surface2:#232128;
  --line:#2E2B36;
  --ink:#F3EFE8;
  --dim:#9C97A6;
  --dim2:#6E6A78;
  --signal:#F0B54A;
  --signal-dim:#8A6E33;
  --miss:#C98793;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg) !important}
body{
  background:var(--bg) !important;color:var(--ink) !important;
  font-family:var(--sans);font-size:17px;line-height:1.65;
  min-height:100vh;
  padding:0 20px calc(48px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
#bg{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:-1}
button{font-family:inherit}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 0 14px;
  position:sticky;top:0;background:var(--bg);z-index:5;
}
#back{background:none;border:none;color:var(--dim);font-size:15px;padding:6px 2px;min-height:36px}
#back.hide{visibility:hidden}
#head{
  flex:1;text-align:center;font-family:var(--mono);
  font-size:11px;letter-spacing:.22em;color:var(--dim2);text-transform:uppercase;
}
#snd{
  background:none;border:1px solid var(--line);color:var(--dim2);
  border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  padding:7px 10px;min-height:30px;
}
#snd.on{color:var(--signal);border-color:var(--signal-dim)}

/* ---------- type ---------- */
h1{
  font-family:var(--mincho);font-size:27px;font-weight:600;
  margin:10px 0 8px;letter-spacing:.04em;color:var(--ink);line-height:1.4;
}
.lead{color:var(--dim);font-size:14px;margin:0 0 26px;line-height:1.8}
.sect{
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim2);
  text-transform:uppercase;margin:30px 0 12px;
  display:flex;align-items:center;gap:12px;
}
.sect:after{content:"";flex:1;height:1px;background:var(--line)}
.note{color:var(--dim2);font-size:12.5px;margin-top:30px;line-height:1.9}

/* ---------- controls ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 8px}
.chip{
  background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:2px;padding:10px 13px;font-size:13.5px;min-height:42px;
  transition:border-color .15s,color .15s;
}
.chip.sel{border-color:var(--signal);color:var(--signal);background:rgba(240,181,74,.07)}
.chip span{font-family:var(--mono);font-size:11px;opacity:.55;margin-left:3px}
.rowbtn{display:flex;gap:8px;margin-bottom:18px}
.rowbtn button{
  flex:1;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:2px;padding:11px;font-size:13px;min-height:44px;
}
.go{
  width:100%;background:var(--signal);border:none;color:#1A1408;border-radius:2px;
  padding:18px;font-size:16px;font-weight:700;letter-spacing:.08em;min-height:58px;margin-top:14px;
}
.go:disabled{background:var(--surface2);color:var(--dim2)}
.ghost{
  width:100%;background:none;border:1px solid var(--line);color:var(--dim);border-radius:2px;
  padding:15px;font-size:14px;min-height:50px;margin-top:9px;letter-spacing:.04em;
}

/* ---------- quiz ---------- */
.prog{display:flex;align-items:center;gap:12px;margin:0 0 30px}
.prog b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim2);font-weight:400}
.ticks{flex:1;display:flex;gap:3px}
.ticks i{flex:1;height:2px;background:var(--line);border-radius:1px}
.ticks i.done{background:var(--signal-dim)}
.ticks i.now{background:var(--signal)}
.tag{
  display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  color:var(--signal);opacity:.75;margin-bottom:18px;
}
.q{
  font-family:var(--mincho);font-size:26px;font-weight:600;line-height:1.85;
  letter-spacing:.03em;margin:0 0 34px;color:var(--ink);
}

/* signature — 1秒ゲージ */
.clock{position:relative;height:22px;margin:0 0 22px}
.clock .rail{position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.clock .run{
  position:absolute;top:0;left:0;height:1px;width:0;background:var(--signal);
  animation:sweep 4s linear forwards;
}
.clock u{position:absolute;top:-3px;width:1px;height:7px;background:var(--dim2);text-decoration:none}
.clock u b{
  position:absolute;top:9px;left:-11px;width:24px;text-align:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--dim2);font-weight:400;
}
.clock u.one{left:25%;background:var(--signal);}
.clock u.one b{color:var(--signal);opacity:.8}
.clock u.three{left:75%}
@keyframes sweep{from{width:0}to{width:100%}}
.clock.wait .run{animation:none;width:0}
.clock.wait u b{opacity:.35}
@media (prefers-reduced-motion:reduce){.clock .run{animation:none;width:100%;opacity:.25}}

.reveal{
  width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:2px;padding:19px;font-size:15px;font-weight:600;letter-spacing:.16em;min-height:58px;
}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin:14px 0 0;text-align:center;letter-spacing:.06em}
.en{
  font-size:25px;font-weight:600;line-height:1.5;margin:0 0 6px;color:#fff;letter-spacing:-.01em;
}
.el{font-family:var(--mono);font-size:11px;color:var(--dim2);margin:16px 0 0;letter-spacing:.08em}
.el b{color:var(--signal);font-weight:400;font-size:14px}
.why{
  background:var(--surface);border-left:2px solid var(--signal-dim);
  padding:14px 16px;margin:20px 0 0;font-size:14.5px;color:var(--dim);line-height:1.85;
}
.warn{
  background:var(--surface);border-left:2px solid var(--miss);
  padding:14px 16px;margin:12px 0 0;font-size:14.5px;color:#E8C3CA;line-height:1.85;
}

/* ---------- judgment: 速さの三段階 ---------- */
.judge{display:flex;gap:8px;margin:32px 0 0}
.judge button{
  flex:1;border-radius:2px;padding:15px 4px;min-height:78px;
  font-size:12.5px;line-height:1.5;border:1px solid;background:transparent;
}
.judge b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;margin-bottom:3px;letter-spacing:.02em}
.j1{background:var(--signal);border-color:var(--signal);color:#1A1408}
.j2{border-color:var(--signal-dim);color:var(--signal);opacity:.9}
.j3{border-color:var(--line);color:var(--dim2)}
.jx{background:rgba(201,135,147,.16);border-color:var(--miss);color:#F3C3CB}

/* ---------- result ---------- */
.score{display:flex;gap:1px;margin:24px 0 8px;background:var(--line);border:1px solid var(--line)}
.cell{flex:1;background:var(--bg);padding:16px 6px;text-align:center}
.cell b{display:block;font-family:var(--mono);font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.cell span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim2)}
.c1 b{color:var(--signal)}
.c2 b{color:var(--signal-dim)}
.c3 b{color:var(--miss)}
.verdict{font-family:var(--mincho);font-size:18px;font-weight:600;margin:22px 0 0;line-height:1.85;letter-spacing:.03em}
.miss{margin:14px 0 0;font-size:14px;color:var(--dim);line-height:1.5}
.miss>div{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.miss span{font-family:var(--mono);font-size:11.5px;color:var(--dim2);letter-spacing:.04em;text-align:right;white-space:nowrap}

textarea{
  width:100%;height:210px;background:var(--surface);color:var(--dim);border:1px solid var(--line);
  border-radius:2px;padding:14px;font-size:12.5px;line-height:1.7;font-family:var(--mono);margin-top:14px;
}
.sp{height:10px}

/* 画面遷移をすこしだけ */
main>*{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
</style>
</head>

{u:"P1U13",label:"P1 U13",theme:"where",cards:[
 {jp:"あなたの{A}はどこにありますか？",en:"Where is your {A}?",s:{A:"obj"},
  why:"「ある・いる」は be動詞。Where + is + 主語の順。"},
 {jp:"あなたはどこで{A}か？",en:"Where do you {A}?",s:{A:"act"},
  why:"動作をたずねるので do を使う。動詞は原形のまま。"},
 {jp:"彼女はどこに住んでいますか？",en:"Where does she live?",s:{},
  why:"三人称単数なので does。live に s は付けない（does が引き受ける）。"},
 {jp:"あなたはどこで勉強しますか？",en:"Where do you study?",s:{},
  note:"× Where are you study? が教材の誤答例。",
  why:"be動詞と一般動詞は同時に使えない。動作の文には do / does、状態や存在の文には be動詞。この分岐がU17・U20まで続く一本の線。"}
,
 {jp:"彼らはどこに住んでいますか？",en:"Where do they live?",s:{},
  why:"they なので do。live は原形。"},
 {jp:"{A}はどこですか？",en:"Where is {A}?",s:{A:"place"},
  why:"場所そのものをたずねる時は be動詞。"},
 {jp:"彼女はどこで{A}か？",en:"Where does she {A}?",s:{A:"act"},
  why:"三人称単数なので does。動詞は原形に戻る。"}
]},
{u:"P1U14",label:"P1 U14",theme:"when",cards:[
 {jp:"あなたの{A}の誕生日はいつですか？",en:"When is your {A}'s birthday?",s:{A:"fam"},
  why:"「〜の」は 's を付ける。主語が単数なので is。"},
 {jp:"彼女はいつ{A}を演奏しますか？",en:"When does she play the {A}?",s:{A:"instrument"},
  why:"楽器には the を付ける。does を使うので play は原形。"},
 {jp:"パーティーはいつですか？　—— 来週の日曜です。",en:"When is the party? —— It is next Sunday.",s:{},
  why:"時をたずねる be動詞の文。next Sunday に前置詞は付けない。"},
 {jp:"彼はいつここに来ますか？",en:"When does he come here?",s:{},
  note:"× When is he come here? は崩れ。",
  why:"U13と同じ分岐。「来る」は動作なので does。ここで迷うならU13の4問目に戻る。"}
,
 {jp:"あなたはいつ{A}か？",en:"When do you {A}?",s:{A:"act"},
  why:"when + 疑問文の語順。動作なので do。"},
 {jp:"彼女の誕生日はいつですか？",en:"When is her birthday?",s:{},
  why:"名詞が主語なので be動詞。do は使わない。"},
 {jp:"テストはいつですか？　—— 来週の金曜日です。",en:"When is the test? —— It is next Friday.",s:{},
  why:"答えは it で受ける。next に the は付けない。"}
]},
{u:"P1U15",label:"P1 U15",theme:"which",cards:[
 {jp:"どちらがあなたの{A}ですか？",en:"Which is your {A}?",s:{A:"obj"},
  why:"Which を単独で主語にする型。後ろは普通の be動詞の文。"},
 {jp:"どちらがあなたの{A}ですか、こちらですか、あちらですか？",
  en:"Which is your {A}, this one or that one?",s:{A:"obj"},
  why:"one は前に出た名詞の代わり。名詞を繰り返さないための語で、会話で頻出。"},
 {jp:"どの{A}があなたのものですか？",en:"Which {A} is yours?",s:{A:"obj"},
  why:"Which + 名詞 の型。答えは This one is. のように one で受ける。"},
 {jp:"どの{A}が好きですか？",en:"Which {A} do you like?",s:{A:"vehicle"},
  why:"Which + 名詞 を do 疑問文につなぐ型。選択肢を聞かれた時にそのまま返せる。"},
 {jp:"どちらがあなたのものですか？",en:"Which one is yours?",s:{},
  why:"one で名詞を省く。yours は your + 名詞 の代わり。"}
,
 {jp:"どちらの{A}が新しいですか？",en:"Which {A} is new?",s:{A:"obj"},
  why:"which + 名詞 が主語。後ろは普通の be動詞の文。"},
 {jp:"あなたはどちらが好きですか、{A}ですか、{B}ですか？",en:"Which do you like, {A} or {B}?",s:{A:"drink",B:"drink"},
  why:"選択肢を後ろに並べる型。Bee のレッスンで頻出。"},
 {jp:"どの{A}があなたのお姉さんのものですか？",en:"Which {A} is your sister's?",s:{A:"obj"},
  why:"人 + 's で「〜のもの」。名詞をくり返さない。"}
]},
{u:"P1U16",label:"P1 U16",theme:"天候・時刻の it",cards:[
 {jp:"今日は{A}です。",en:"It is {A} today.",s:{A:"weather"},
  why:"天気の文は it を主語にする。この it は「それ」と訳さない。"},
 {jp:"東京は{A}ですか？",en:"Is it {A} in Tokyo?",s:{A:"weather"},
  why:"場所は in 〜 で後ろに付ける。主語はあくまで it。"},
 {jp:"今、{A}です。",en:"It is {A} now.",s:{A:"time"},
  why:"時刻も it が主語。「〜時です」は It is + 時刻。"},
 {jp:"今日はいい天気です。",en:"It is fine today.",s:{},
  note:"× Today is fine. と言いたくなるが英語の型ではない。",
  why:"天気・時刻・気温・明暗はすべて it を主語に立てる。日本語の「今日は」に引きずられないこと。"}
,
 {jp:"外は{A}ですか？",en:"Is it {A} outside?",s:{A:"weather"},
  why:"天候の it。何を指すでもない主語。"},
 {jp:"今日は寒くありません。",en:"It is not cold today.",s:{},
  why:"天候の否定も主語は it。日本語に主語がなくても省かない。"},
 {jp:"毎日{A}です。",en:"It is {A} every day.",s:{A:"weather"},
  why:"習慣を言う時も it。主語を省かない。"}
]},
{u:"P1U17",label:"P1 U17",theme:"What time 〜?",cards:[
 {jp:"今何時ですか？",en:"What time is it now?",s:{},
  why:"時刻をたずねる決まった型。主語は it。U16と同じ発想。"},
 {jp:"あなたは何時に{A}か？",en:"What time do you {A}?",s:{A:"dailyAct"},
  why:"動作なので do。What time をひとかたまりで文頭に出す。"},
 {jp:"彼は何時に起きますか？　—— 5時に起きます。",en:"What time does he get up? —— He gets up at five.",s:{},
  why:"does を使うので疑問文の動詞は原形、答えの文では gets と s が戻る。"},
 {jp:"あなたは何時に寝ますか？",en:"What time do you go to bed?",s:{},
  note:"× What time are you go to bed? が教材の誤答例。",
  why:"U13で出た分岐がそのまま再登場する。時刻そのものをたずねる（What time is it?）なら be動詞、動作をたずねるなら do。"}
,
 {jp:"彼女は何時に{A}か？",en:"What time does she {A}?",s:{A:"dailyAct"},
  why:"三人称単数なので does。動詞は原形。"},
 {jp:"パーティーは何時に始まりますか？",en:"What time does the party start?",s:{},
  why:"the party は三人称単数。does を落としやすい。"},
 {jp:"今何時ですか？　—— 8時15分です。",en:"What time is it now? —— It is eight fifteen.",s:{},
  why:"時刻の答えも it。数字だけで返さない。"}
]},
{u:"P1U18",label:"P1 U18",theme:"how",cards:[
 {jp:"ご機嫌いかがですか？　—— 元気です、ありがとう。",en:"How are you? —— I'm fine, thank you.",s:{},
  why:"状態をたずねる how。be動詞を使う。レッスンの冒頭でそのまま使う型。"},
 {jp:"あなたの{A}はどうやって学校に行きますか？",en:"How does your {A} go to school?",s:{A:"fam"},
  why:"手段をたずねる how。動作なので does。答えは by bus / on foot など。"},
 {jp:"これはどのように使うのですか？",en:"How do I use this?",s:{},
  why:"使い方をたずねる定番。困った時にそのまま出せるので丸ごと覚える。"},
 {jp:"どうやって学校に行きますか？",en:"How do you go to school?",s:{},
  note:"状態をきくなら How are you?、動作をきくなら How do 〜?。同じ how でも中身で分かれる。",
  why:"手段をたずねる how。動作なので do が要る。be動詞と混ざりやすい箇所。"}
,
 {jp:"あなたのお母さんはお元気ですか？",en:"How is your mother?",s:{},
  why:"状態をたずねる how。三人称単数なので is。"},
 {jp:"どうやって駅に行きますか？",en:"How do you go to the station?",s:{},
  why:"手段の how。the station に the を付ける。"},
 {jp:"この単語はどう言うのですか？",en:"How do you say this word?",s:{},
  why:"言い方をたずねる定番。レッスン中にそのまま使える。"}
]},
{u:"P1U19",label:"P1 U19",theme:"How old (tall / much) 〜?",cards:[
 {jp:"あなたは何歳ですか？　—— 15歳です。",en:"How old are you? —— I am fifteen years old.",s:{},
  why:"年齢は be動詞。years old は答えに付ける（省略も可）。"},
 {jp:"あなたの{A}は何歳ですか？",en:"How old is your {A}?",s:{A:"fam"},
  why:"主語が単数なので is。How old をひとかたまりで前に出す。"},
 {jp:"この{A}はいくらですか？　—— 1000円です。",en:"How much is this {A}? —— It is one thousand yen.",s:{A:"obj"},
  why:"値段は how much。答えの主語は it。yen は複数形にしない。"},
 {jp:"あなたの{A}の身長はどれくらいですか？",en:"How tall is your {A}?",s:{A:"fam"},
  note:"how + 形容詞（old / tall / much）のセットを混同しない。",
  why:"どれも be動詞で作る。日本語では「何歳」「どれくらい」「いくら」と別の言い方になるので、形容詞を先に決めてから文を組む。"}
,
 {jp:"これらの{A}はいくらですか？",en:"How much are these {A*}?",s:{A:"obj"},
  why:"複数なら are。is にしやすい箇所。"},
 {jp:"あなたのお父さんは何歳ですか？",en:"How old is your father?",s:{},
  why:"年齢は old。答えは 〜 years old。"},
 {jp:"この建物はどれくらいの高さですか？",en:"How tall is this building?",s:{},
  why:"高さも tall。建物にも使える。"}
]},
{u:"P1U20",label:"P1 U20",theme:"疑問詞主語の who",cards:[
 {jp:"誰がこの{A}を掃除するのですか？",en:"Who cleans this {A}?",s:{A:"room"},
  why:"who が主語なので語順は肯定文と同じ。三人称単数として扱うので動詞に s が付く。"},
 {jp:"誰が{A}を上手に話しますか？",en:"Who speaks {A} well?",s:{A:"lang"},
  why:"speaks の s を落とさない。well は文末。"},
 {jp:"誰がこの{A}を運転しますか？　—— 私の姉です。",en:"Who drives this {A}? —— My sister does.",s:{A:"vehicle"},
  why:"答えは主語 + do / does。drive を繰り返さない。U7の代動詞と同じ考え方。"},
 {jp:"誰がこの部屋を掃除するのですか？",en:"Who cleans this room?",s:{},
  note:"× Who does clean this room? が教材の誤答例。",
  why:"疑問詞が主語のときは do / does を使わない。代わりに動詞に三単現の s を付ける。U7の s とこの課は同じ論点。"}
,
 {jp:"誰がこの{A}を使いますか？",en:"Who uses this {A}?",s:{A:"obj"},
  why:"who が主語なので does は不要。動詞に s が付く。"},
 {jp:"誰が{A}を演奏しますか？",en:"Who plays the {A}?",s:{A:"instrument"},
  why:"楽器には the。who は三人称単数扱い。"},
 {jp:"誰が毎朝犬を散歩させますか？",en:"Who walks the dog every morning?",s:{},
  why:"疑問詞が主語の型。語順は普通の文と同じ。"}
]},
{u:"P1U21",label:"P1 U21",theme:"can",cards:[
 {jp:"私は{A}を演奏できます。",en:"I can play the {A}.",s:{A:"instrument"},
  why:"can の後ろは必ず動詞の原形。主語が誰でも can の形は変わらない。"},
 {jp:"あなたは{A}ことができますか？",en:"Can you {A}?",s:{A:"canAct"},
  why:"疑問文は can を前に出すだけ。do は使わない。"},
 {jp:"彼女は{A}ことができません。",en:"She can't {A}.",s:{A:"canAct"},
  why:"否定は can't（cannot）。三単現の s は付かない。"},
 {jp:"彼は{A}を話せますか？",en:"Can he speak {A}?",s:{A:"lang"},
  note:"× Can he speaks English? が教材の誤答例。",
  why:"can の後ろに s を付けてしまうのが最頻出の崩れ。三単現の s は can が引き受けるので動詞は原形に戻る。"}
,
 {jp:"私は{A}ことができません。",en:"I can't {A}.",s:{A:"canAct"},
  why:"can の否定は can't。後ろは必ず原形。"},
 {jp:"彼らは{A}を話すことができますか？",en:"Can they speak {A}?",s:{A:"lang"},
  why:"疑問文は Can を前に出すだけ。do は使わない。"},
 {jp:"手伝ってもらえますか？",en:"Can you help me?",s:{},
  why:"依頼の can。困った時にそのまま出せる型。"}
]},
{u:"P1U22",label:"P1 U22",theme:"現在進行形",cards:[
 {jp:"私は今{A}いるところです。",en:"I am {A} now.",s:{A:"doing"},
  why:"be動詞 + 動詞ing。be動詞を落とすと文にならない。"},
 {jp:"あなたは今{A}いるのですか？",en:"Are you {A} now?",s:{A:"doing"},
  why:"疑問文は be動詞を前に出す。do は使わない。"},
 {jp:"彼らは今{A}いません。",en:"They are not {A} now.",s:{A:"doing"},
  why:"否定は be動詞の直後に not。aren't と短縮してもよい。"},
 {jp:"彼女は眠っているのですか？",en:"Is she sleeping?",s:{},
  note:"× Does she sleeping? が教材の誤答例。",
  why:"進行形は be動詞の文。do / does は使わない。U21の can と隣り合うので混同しやすい。「ing が見えたら be動詞」で覚える。"}
,
 {jp:"彼は{A}います。",en:"He is {A}.",s:{A:"doing"},
  why:"be動詞 + 動詞ing。be を落とすと文にならない。"},
 {jp:"あなたは何をしているのですか？",en:"What are you doing?",s:{},
  why:"進行形の疑問。Bee のレッスン冒頭で頻出。"},
 {jp:"彼女は{A}いません。",en:"She is not {A}.",s:{A:"doing"},
  why:"否定は be動詞の後ろに not。doesn't は使わない。"}
]},
{u:"P1U23",label:"P1 U23",theme:"There is (are) 〜",cards:[
 {jp:"その{A}には窓が三つあります。",en:"There are three windows in the {A}.",s:{A:"room"},
  why:"There is / are は「〜がある」。後ろの名詞が複数なので are。"},
 {jp:"{A}に{B}はいますか？",en:"Are there any {B*} in {A}?",s:{A:"placeIn",B:"animal"},
  why:"疑問文は there の前に be動詞を出す。疑問文の「いくつか」は any。"},
 {jp:"この{A}には花が一輪もありません。",en:"There are not any flowers in this {A}.",s:{A:"room"},
  why:"not any=一つもない。flowers が複数なので are not。"},
 {jp:"この部屋には本が一冊もありません。",en:"There aren't any books in this room.",s:{},
  note:"× There isn't any books は教材の誤答例。",
  why:"is / are は後ろの名詞で決める。books が複数なら aren't。there は主語ではないので判断材料にならない。"}
,
 {jp:"{A}に猫がいます。",en:"There is a cat in {A}.",s:{A:"placeIn"},
  why:"単数なら There is。cat に a が要る。"},
 {jp:"この{A}にはテーブルがありますか？",en:"Is there a table in the {A}?",s:{A:"room"},
  why:"疑問文は Is を前に。there はそのまま残る。"},
 {jp:"公園にはたくさんの人がいます。",en:"There are many people in the park.",s:{},
  why:"people は複数扱いなので are。"}
]},
{u:"P2U01",label:"P2 U1",theme:"過去形",tags:["past"],cards:[
 {jp:"昨日私は{A}。",en:"I was {A} yesterday.",s:{A:"adjPast"},
  why:"be動詞の過去は was / were。I と he / she / it は was、you と複数は were。"},
 {jp:"私たちは去年{A}を訪れました。",en:"We visited {A} last year.",s:{A:"country"},
  why:"一般動詞の過去は原則 ed。last year に前置詞は付けない。"},
 {jp:"あなたはいつ{A}か？",en:"When did you {A}?",s:{A:"actPast"},
  why:"過去の疑問文は did。did の後ろの動詞は必ず原形に戻る。"},
 {jp:"彼らは昼食に何を食べましたか？",en:"What did they eat for lunch?",s:{},
  note:"× What did they ate? は崩れ。",
  why:"did が過去を引き受けるので動詞は原形（eat）。be動詞の過去（was / were）と一般動詞の過去（did）は別系統として分けて持つ。この課が久間木テストの「週末何してた?」の入口。"}
,
 {jp:"彼女は昨日忙しかったです。",en:"She was busy yesterday.",s:{},
  why:"be動詞の過去は was。「〜でした」はこの形。"},
 {jp:"あなたは昨日{A}か？",en:"Were you {A} yesterday?",s:{A:"adjPast"},
  why:"you の過去は were。was にしやすい。"},
 {jp:"彼らは昨日パーティーに行きませんでした。",en:"They didn't go to the party yesterday.",s:{},
  why:"一般動詞の過去の否定は didn't + 原形。went に戻さない。"}
]},
{u:"P2U02",label:"P2 U2",theme:"過去進行形",tags:["past"],cards:[
 {jp:"彼女はその時{A}いました。",en:"She was {A} then.",s:{A:"doing"},
  why:"was / were + 動詞ing。「その時〜していた」。then は文末。"},
 {jp:"あなたは{A}いたのですか？",en:"Were you {A}?",s:{A:"doing"},
  why:"疑問文は were を前に出すだけ。did は使わない。"},
 {jp:"彼らはその時{A}いませんでした。",en:"They were not {A} then.",s:{A:"doing"},
  why:"否定は were の直後に not。weren't と短縮してもよい。"},
 {jp:"トムは2時間前に何をしていましたか？",en:"What was Tom doing two hours ago?",s:{},
  note:"× What did Tom doing? は崩れ。",
  why:"進行形は be動詞の文なので過去でも was / were を使う。two hours ago=2時間前。ago は数量の後ろに置く。"}
,
 {jp:"私はその時{A}いました。",en:"I was {A} then.",s:{A:"doing"},
  why:"過去進行形は was / were + 動詞ing。"},
 {jp:"彼らはその時何をしていましたか？",en:"What were they doing then?",s:{},
  why:"they なので were。「先週何をしていましたか」の土台。"},
 {jp:"あなたは2時間前に{A}いましたか？",en:"Were you {A} two hours ago?",s:{A:"doing"},
  why:"〜前は ago。文末に置く。"}
]},
{u:"P2U03",label:"P2 U3",theme:"when 節",tags:["past"],cards:[
 {jp:"彼女は彼に再会した時、とても幸せでした。",en:"She was very happy when she saw him again.",s:{},
  why:"when は2つの文をつなぐ接続詞。when の後ろは主語＋動詞の形が続く。"},
 {jp:"お母さんが部屋に入ってきた時、僕は{A}いました。",en:"I was {A} when my mother came into the room.",s:{A:"doing"},
  why:"主節が過去進行形、when 節が過去形。「〜していた時に〜が起きた」の型。"},
 {jp:"あなたが電話した時、あなたの{A}は家にいましたか？",en:"Was your {A} at home when you called?",s:{A:"fam"},
  why:"疑問文にするのは主節だけ。when 節はそのままの語順。"},
 {jp:"夏が来ると、たくさんの人が海に行きます。",en:"When summer comes, many people go to the sea.",s:{},
  note:"× When summer will come とはしない。",
  why:"時を表す節の中は、未来のことでも現在形で書く。シャドーイングT3の同じルールと一致する。when 節を文頭に置いたらコンマで区切る。"}
,
 {jp:"私が家を出た時、雨が降っていました。",en:"It was raining when I left home.",s:{},
  why:"主節が過去進行形、when 節が過去形。時間の重なりを表す。"},
 {jp:"彼が来た時、私は{A}いました。",en:"I was {A} when he came.",s:{A:"doing"},
  why:"when 節の中は過去形。ここを進行形にしない。"},
 {jp:"あなたが電話した時、彼女は何をしていましたか？",en:"What was she doing when you called?",s:{},
  why:"久間木テストで過去を聞かれた時に返す型。"}
]},
{u:"P2U04",label:"P2 U4",theme:"一般動詞の SVC",tags:["past"],cards:[
 {jp:"彼はとても{A}に見えます。",en:"He looks very {A}.",s:{A:"adjSou"},
  why:"look + 形容詞で「〜に見える」。be動詞の代わりに使える動詞。"},
 {jp:"このスープはとてもおいしいです。",en:"This soup tastes very good.",s:{},
  why:"taste + 形容詞で「〜な味がする」。× tastes well とはしない。"},
 {jp:"その{A}はとても大きくなりました。",en:"The {A} became very big.",s:{A:"animal"},

/* ==========================================================================
   3. アプリ本体 — 瞬間英作文の差し替えドリル専用
   保存機能なし。記録はレッスン記録Markdownへ手で残す（結果テキストを書き出せる）。
   ========================================================================== */

/* ---- 範囲プリセット ---- */
var P1_ALL = [], P2_ALL = [], ALL = [];
SHUNSAKU.forEach(function(u){
  ALL.push(u.u);
  (u.u.indexOf("P1") === 0 ? P1_ALL : P2_ALL).push(u.u);
});
var CHECK_0812 = ALL.filter(function(x){
  return (x >= "P1U17" && x <= "P1U23") || x.indexOf("P2") === 0;
});
var KEEP_P1 = P1_ALL.filter(function(x){ return x <= "P1U16"; });

/* 記録から「言えなかった」ユニットを拾う */
function weakUnits(){
  var lg = loadLog();
  if(!lg.length) return [];
  var by = {};
  lg.forEach(function(s2){
    for(var k in (s2.by || {})){
      by[k] = (by[k] || 0) + (s2.by[k].x || 0) + (s2.by[k].three || 0);
    }
  });
  var out = [];
  SHUNSAKU.forEach(function(u){ if(by[u.label] > 0) out.push(u.u); });
  return out;
}

var PRESETS = [
  { id:"check", label:"8/12の範囲",   units:CHECK_0812 },
  { id:"keep",  label:"P1 U1〜16 維持", units:KEEP_P1 },
  { id:"p1",    label:"Part1 全部",   units:P1_ALL },
  { id:"p2",    label:"Part2 全部（過去形）", units:P2_ALL },
  { id:"all",   label:"全28ユニット", units:ALL }
];

/* ---- 差し替え（{A} 単数 / {A#} a・an付き / {A*} 複数） ---- */
function pick(key, used){
  var arr = POOL[key] || [];
  var free = arr.filter(function(e){ return used.indexOf(e) < 0; });
  var src = free.length ? free : arr;
  return src[Math.floor(Math.random() * src.length)];
}
function plural(e){
  if(e.pl) return e.pl;
  var w = e.en;
  if(/(s|x|ch|sh)$/.test(w)) return w + "es";
  if(/[^aeiou]y$/.test(w)) return w.slice(0,-1) + "ies";
  return w + "s";
}
function art(e){ return (e.an ? "an " : "a ") + e.en; }
function fill(card){
  var used = [], chosen = {};
  for(var k in (card.s || {})){
    var e = pick(card.s[k], used);
    if(e){ used.push(e); chosen[k] = e; }
  }
  function sub(str, lang){
    return String(str).replace(/\{([A-Z])([#*])?\}/g, function(m, k, mark){
      var e = chosen[k];
      if(!e) return m;
      if(lang === "ja") return e.ja;
      if(mark === "*") return plural(e);
      if(mark === "#") return art(e);
      return e.en;
    });
  }
  return { jp: sub(card.jp, "ja"), en: sub(card.en, "en"), why: card.why, note: card.note };
}

/* ---- 出題プール ---- */
function items(units){
  var out = [];
  SHUNSAKU.forEach(function(u){
    if(units && units.indexOf(u.u) < 0) return;
    u.cards.forEach(function(c, i){
      out.push({ unit:u.u, src:u.label + " " + u.theme, label:u.label, card:c, no:i+1, filled:null });
    });
  });
  return out;
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ---- 音声 ---- */
var SND = true;    /* 英語（答え）の読み上げ */
var JASND = false; /* 日本語（問題）の読み上げ */
function hasTTS(){ return "speechSynthesis" in window; }
function speak(text){
  if(!SND || !hasTTS()) return;
  try{
    speechSynthesis.cancel();
    var t = String(text).replace(/——/g, ".").replace(/\s+/g, " ");
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US"; u.rate = 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 問題文の読み上げ。「／」以降の言い換えは読まない。読み終わりで計測開始 */
function speakJa(text, onEnd){
  if(!JASND || !hasTTS()){ if(onEnd) onEnd(); return; }
  try{
    speechSynthesis.cancel();
    var t = String(text).split("／")[0].replace(/——/g, "、").replace(/\s+/g, " ");
    var u = new SpeechSynthesisUtterance(t);
    u.lang = "ja-JP"; u.rate = 1.0;
    var fired = false;
    u.onend = function(){ if(!fired){ fired = true; if(onEnd) onEnd(); } };
    u.onerror = function(){ if(!fired){ fired = true; if(onEnd) onEnd(); } };
    speechSynthesis.speak(u);
    /* 音声が返ってこない端末向けの保険 */
    setTimeout(function(){ if(!fired){ fired = true; if(onEnd) onEnd(); } }, 6000);
  }catch(e){ if(onEnd) onEnd(); }
}

/* ---- 記録（端末内に保存。iPhoneのホーム画面アプリで永続する） ---- */
var LSKEY = "shunsaku.log.v1";
function loadLog(){
  try{ var a = JSON.parse(localStorage.getItem(LSKEY) || "[]"); return a.length ? a : []; }
  catch(e){ return []; }
}
function saveLog(a){
  try{ localStorage.setItem(LSKEY, JSON.stringify(a)); return true; }catch(e){ return false; }
}
function pushLog(rec){
  var a = loadLog(); a.push(rec);
  if(a.length > 400) a = a.slice(a.length - 400);
  return saveLog(a);
}
/* 累積の弱点: ユニットごとに「出題回数」と「落ちた回数」 */
function weakness(log){
  var m = {};
  log.forEach(function(s){
    for(var k in (s.seen || {})){
      m[k] = m[k] || { seen:0, miss:0 };
      m[k].seen += s.seen[k];
    }
    for(var k2 in (s.by || {})){
      m[k2] = m[k2] || { seen:0, miss:0 };
      m[k2].miss += (s.by[k2].three || 0) + (s.by[k2].x || 0);
    }
  });
  return Object.keys(m).filter(function(k){ return m[k].miss > 0; })
    .map(function(k){ return { label:k, seen:m[k].seen, miss:m[k].miss,
                               rate: m[k].seen ? m[k].miss / m[k].seen : 1 }; })
    .sort(function(a, b){ return (b.rate - a.rate) || (b.miss - a.miss); });
}

/* ---- 自動再生（耳だけ） ---- */
function say(text, lang, rate, done){
  if(!hasTTS()){ if(done) setTimeout(done, 500); return; }
  var t = String(text).split("／")[0]
            .replace(/——/g, lang === "ja-JP" ? "、" : ".")
            .replace(/\s+/g, " ");
  try{
    var u = new SpeechSynthesisUtterance(t);
    u.lang = lang; u.rate = rate;
    var fired = false;
    var fin = function(){ if(!fired){ fired = true; if(done) done(); } };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 14000);
  }catch(e){ if(done) done(); }
}
var A = { on:false, paused:false, q:[], i:0, lap:1, gap:5000, reps:2, phase:"ja", tok:0, timer:null };
function autoHalt(){
  A.tok++; A.on = false; A.paused = false;
  if(A.timer) clearTimeout(A.timer);
  if(hasTTS()) speechSynthesis.cancel();
}
function autoStep(){
  if(!A.on || A.paused) return;
  if(A.i >= A.q.length){ A.q = shuffle(A.q); A.i = 0; A.lap++; }
  var my = ++A.tok;
  var it = A.q[A.i];
  it.filled = fill(it.card);
  A.phase = "ja"; autoRender();
  say(it.filled.jp, "ja-JP", 1.0, function(){
    if(!A.on || A.paused || my !== A.tok) return;
    A.timer = setTimeout(function(){
      if(!A.on || A.paused || my !== A.tok) return;
      A.phase = "en"; autoRender();
      var n = 0;
      (function rep(){
        if(!A.on || A.paused || my !== A.tok) return;
        say(it.filled.en, "en-US", 0.92, function(){
          if(!A.on || A.paused || my !== A.tok) return;
          n++;
          if(n < A.reps){ A.timer = setTimeout(rep, 700); }
          else { A.timer = setTimeout(function(){
                   if(!A.on || A.paused || my !== A.tok) return;
                   A.i++; autoStep();
                 }, 1400); }
        });
      })();
    }, A.gap);
  });
}

/* ---- 状態 ---- */
var S = {
  screen:"home", back:null,
  units:CHECK_0812.slice(), presetId:"check", limit:20,
  queue:[], i:0, shown:false, round:1, t0:0,

function esc(s){

}
function rich(s){ return esc(s).replace(/&lt;br&gt;/g, "<br>"); }

/* ---- ホーム ---- */

  });
  h += '<button class="chip' + (S.presetId === "custom" ? ' sel' : '') + '" data-go="unit">個別に選ぶ…</button></div>' +
       '<p class="lead" style="margin:2px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim2)">選択中 ' + S.units.length + 'ユニット / ' + n + '問</p>' +

       '<button class="chip' + (SND ? ' sel' : '') + '" data-v="en">英語（答え）</button>' +
       '</div>' +
       (JASND ? '<p class="lead" style="margin:2px 0 0;font-size:12.5px">画面を見ずにできる。読み終わりから計測が始まる。</p>' : '') +
       '<button class="go" data-go="start"' + (n ? '' : ' disabled') + '>始める（' +
       (S.limit ? Math.min(S.limit, n) : n) + '問）</button>' +
       '<button class="ghost" data-go="auto">耳だけで流す（自動再生）</button>' +
       '<button class="ghost" data-go="hist">記録を見る' +

         + (last ? ' ・ 直近 ' + Math.round(last.n1 / Math.max(1, last.tot) * 100) + '%' : '') + '）' : '') +
       '</button>' +
       '<p class="note">名詞は毎回入れ替わる。同じ文でも同じ答えにはならない。<br><br>' +
       '<b style="color:#5fd39a">v15.0</b> ・ 日本語の疑問文に「？」を表示（116問）。判定ボタンを「できた / できなかった」に統一し、両方を同じ大きさ・同じ濃さに。</p>';
  app.innerHTML = h;

/* ---- ユニットを個別に選ぶ ---- */
function unitFilter(){
  S.screen = "unit"; S.back = "home";
  head.textContent = "ユニットを選ぶ";
  backBtn.className = "";
  var sel = S.units;
  var h = '<h1>ユニットを選ぶ</h1><div class="rowbtn">' +
          '<button data-all="1">全部</button><button data-all="0">解除</button></div><div class="chips">';
  SHUNSAKU.forEach(function(u){
    h += '<button class="chip' + (sel.indexOf(u.u) >= 0 ? ' sel' : '') +
         '" data-u="' + u.u + '">' + esc(u.label) + '</button>';
  });
  h += '</div><button class="go" data-go="home"' + (sel.length ? '' : ' disabled') +
       '>この範囲にする（' + sel.length + 'ユニット）</button>';

}

/* ---- 出題 ---- */
function start(pool, label){
  if(!pool.length){ app.innerHTML = '<h1>この範囲に問題がありません</h1>'; return; }
  var q = shuffle(pool);
  if(S.limit) q = q.slice(0, S.limit);
  q.forEach(function(x){ x.filled = null; });
  S.queue = q; S.i = 0; S.shown = false; S.round = 1;
  S.n1 = 0; S.n3 = 0; S.nx = 0; S.miss = [];
  S.startedAt = new Date(); S.rangeLabel = label; S.snap = null;
  quiz();
}
function quiz(){
  S.screen = "quiz"; S.back = "home";
  backBtn.className = "";
  head.textContent = "瞬間英作文" + (S.round > 1 ? " ・ 苦手のみ" : "");
  var it = S.queue[S.i];
  if(!it){ result(); return; }
  if(!it.filled) it.filled = fill(it.card);
  var f = it.filled;
  var ticks = "";
  for(var t2 = 0; t2 < S.queue.length; t2++){
    ticks += '<i class="' + (t2 < S.i ? 'done' : (t2 === S.i ? 'now' : '')) + '"></i>';
  }
  var h = '<div class="prog"><b>' + pad(S.i + 1) + ' / ' + pad(S.queue.length) + '</b>' +
          '<span class="ticks">' + ticks + '</span></div>' +
          '<div class="tag">' + esc(it.src) + '</div>' +
          '<p class="q">' + esc(f.jp) + '</p>';
  if(!S.shown){
    h += '<button class="reveal" data-act="show">答 え</button>' +
         (JASND ? '<button class="ghost" data-act="replay">もう一度聞く</button>' : '') +
         '<p class="hint">先に声に出す。黙読で押さない。</p>';
  }else{
    h += '<p class="en">' + esc(f.en) + '</p>';
    if(f.note) h += '<div class="warn">' + rich(f.note) + '</div>';
    if(f.why)  h += '<div class="why">' + rich(f.why) + '</div>';
    h += '<div class="judge">' +
         '<button class="j1" data-act="j1"><b>◯</b>できた</button>' +
         '<button class="jx" data-act="jx"><b>×</b>できなかった</button>' +
         '</div>' +
         '<p class="hint" style="margin-top:14px">詰まった・途中で止まった・違う言い方をした → ×</p>';
  }
  app.innerHTML = h;
  if(S.shown){ speak(f.en); return; }
  S.t0 = Date.now();
  if(JASND) speakJa(f.jp, function(){ S.t0 = Date.now(); });
}
function judge(kind){
  var it = S.queue[S.i];
  if(kind === "1") S.n1++;
  else{
    S.nx++;
    it.mark = "x";
    if(S.miss.indexOf(it) < 0) S.miss.push(it);
  }
  S.i++; S.shown = false;
  if(S.i >= S.queue.length) result(); else quiz();
}

/* ---- 結果 ---- */
function result(){
  S.screen = "result"; S.back = "home";
  head.textContent = "おわり";
  backBtn.className = "";
  var tot = S.n1 + S.n3 + S.nx;
  var rate = tot ? Math.round(S.n1 / tot * 100) : 0;
  if(S.round === 1 && !S.snap){
    var sb = {};
    S.miss.forEach(function(m){
      sb[m.label] = sb[m.label] || { three:0, x:0 };
      if(m.mark === "3") sb[m.label].three++; else sb[m.label].x++;
    });
    var seen = {};
    S.queue.forEach(function(q){ seen[q.label] = (seen[q.label] || 0) + 1; });
    S.snap = { n1:S.n1, n3:S.n3, nx:S.nx, tot:tot, by:sb, seen:seen };
    var d = S.startedAt || new Date();
    S.saved = pushLog({
      d: d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()),
      range: S.rangeLabel, units: S.units.length,
      n1:S.n1, n3:S.n3, nx:S.nx, tot:tot, by:sb, seen:seen,
      min: Math.max(1, Math.round((Date.now() - d.getTime()) / 60000))
    });
  }
  var v = rate === 100 ? "全問できた。この範囲は合格扱いにしていい。"
        : rate >= 80  ? "できたのが " + S.n1 + "問。残り " + (tot - S.n1) + "問を潰せば合格。"
        : rate >= 50  ? "半分は出ている。できなかった分をもう1周してから次へ。"
        :               "まだ定着していない。範囲を広げず、ここを繰り返す。";
  var h = '<h1>瞬間英作文</h1><p class="lead">' + esc(S.rangeLabel) + ' ・ ' + tot + '問</p>' +
    '<div class="score">' +
    '<div class="cell c1"><b>' + S.n1 + '</b><span>できた</span></div>' +
    '<div class="cell c3"><b>' + S.nx + '</b><span>できなかった</span></div>' +
    '<div class="cell"><b style="color:var(--dim)">' + rate + '<span style="font-size:15px">%</span></b><span>達成率</span></div>' +
    '</div><p class="verdict">' + esc(v) + '</p>';

  if(S.miss.length){
    var by = {};
    S.miss.forEach(function(m){
      by[m.label] = by[m.label] || { one:0, three:0, x:0, theme:m.src };
      if(m.mark === "3") by[m.label].three++; else by[m.label].x++;
    });
    h += '<div class="sect">できなかったユニット</div><div class="miss">';
    Object.keys(by).sort().forEach(function(k){
      var b = by[k];
      h += '<div><span style="font-family:var(--sans);font-size:14px;color:var(--ink)">' + esc(k) +
           '</span><span>' + (b.x + (b.three || 0)) + '問</span></div>';
    });
    h += '</div><div class="sp"></div>' +
         '<button class="go" data-act="again">この ' + S.miss.length + '問をもう一度（名詞は入れ替わる）</button>';
  }
  var lg = loadLog();
  h += '<p class="el">' + (S.saved === false
        ? '記録できず — プライベートブラウズでは保存されない'
        : '記録済 — 通算 ' + lg.length + 'セット目') + '</p>' +
       '<button class="ghost" data-act="same">同じ範囲でもう1セット</button>' +
       '<button class="ghost" data-go="hist">記録を見る</button>' +
       '<button class="ghost" data-go="record">今回の記録用テキスト</button>' +
       '<button class="ghost" data-go="home">ホーム</button>';
  app.innerHTML = h;
}

/* ---- 記録用テキスト ---- */
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function recordText(){
  var d = S.startedAt || new Date();
  var min = Math.max(1, Math.round((Date.now() - d.getTime()) / 60000));
  var s = S.snap || { n1:S.n1, n3:S.n3, nx:S.nx, tot:S.n1 + S.n3 + S.nx, by:{} };
  var by = s.by;
  var t = "### 瞬間英作文 " + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "\n" +
    "- 範囲: " + S.rangeLabel + "（" + S.units.length + "ユニット）\n" +
    "- 出題: " + s.tot + "問 ／ 所要 約" + min + "分" + (S.round > 1 ? " ／ 苦手リトライ " + (S.round - 1) + "回" : "") + "\n" +
    "- **できた: " + s.n1 + "**　できなかった: " + (s.nx + (s.n3 || 0)) +
    "　達成率 " + Math.round(s.n1 / Math.max(1, s.tot) * 100) + "%（1周目の値）\n";
  var keys = Object.keys(by).sort();
  if(keys.length){
    t += "- できなかったユニット:\n";
    keys.forEach(function(k){
      t += "  - " + k + " — " + (by[k].x + (by[k].three || 0)) + "問\n";
    });
  }else{
    t += "- できなかったユニット: なし\n";
  }
  t += "- 気づき: \n";
  return t;
}
function fullLogText(){
  var lg = loadLog();
  var t = "## 瞬間英作文ドリル 記録（" + lg.length + "セット）\n\n";
  var tot = lg.reduce(function(a, s2){ return a + s2.tot; }, 0);
  var one = lg.reduce(function(a, s2){ return a + s2.n1; }, 0);
  t += "- 通算 " + tot + "問 ／ 1秒合格 " + one + "問（" + Math.round(one / Math.max(1, tot) * 100) + "%）\n\n";
  var w = weakness(lg);
  if(w.length){
    t += "### 繰り返し落ちているユニット\n\n| ユニット | 出題 | 落ち | 率 |\n|---|---|---|---|\n";
    w.forEach(function(x){
      t += "| " + x.label + " | " + x.seen + " | " + x.miss + " | " + Math.round(x.rate * 100) + "% |\n";
    });
    t += "\n";
  }
  t += "### セット履歴\n\n| 日付 | 範囲 | 問数 | 1秒 | 3秒 | × |\n|---|---|---|---|---|---|\n";
  lg.forEach(function(s2){
    t += "| " + s2.d + " | " + s2.range + " | " + s2.tot + " | " + s2.n1 + " | " + s2.n3 + " | " + s2.nx + " |\n";
  });
  return t;
}
function recordView(full){
  S.screen = "record"; S.back = full ? "hist" : "result";
  head.textContent = "記録用テキスト";
  backBtn.className = "";
  app.innerHTML = '<h1>' + (full ? '全記録' : '今回の記録') + '</h1>' +
    '<p class="lead">レッスン記録のMarkdownに貼る。' +
    (full ? '' : '「気づき」は自分で書き足す。') + '</p>' +
    '<textarea id="rec" readonly></textarea>' +
    '<button class="go" data-act="copy" style="margin-top:12px">コピーする</button>' +
    '<button class="ghost" data-go="home">ホーム</button>';
  document.getElementById("rec").value = full ? fullLogText() : recordText();
}

/* ---- 自動再生の画面 ---- */
function autoSetup(){
  S.screen = "autoset"; S.back = "home"; autoHalt();
  head.textContent = "自動再生";
  backBtn.className = "";
  var n = items(S.units).length;
  var h = '<h1>耳だけで流す</h1>' +
    '<p class="lead">日本語 → 考える間 → 英語、をずっと繰り返します。<br>' +
    '手が離せないときの<b style="color:var(--signal)">補助</b>。判定はなく、記録にも残りません。</p>' +
    '<div class="sect">範囲</div>' +
    '<p class="lead" style="margin:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--dim2)">' +
    esc(S.rangeLabel === "8/12の範囲" || true ? "" : "") + S.units.length + 'ユニット / ' + n + '問　※ホームで変更</p>' +
    '<div class="sect">考える間</div><div class="chips">';
  [[3000,"3秒"],[5000,"5秒"],[8000,"8秒"]].forEach(function(g){
    h += '<button class="chip' + (A.gap === g[0] ? ' sel' : '') + '" data-g="' + g[0] + '">' + g[1] + '</button>';
  });
  h += '</div><div class="sect">英語をくり返す</div><div class="chips">';
  [[1,"1回"],[2,"2回"]].forEach(function(r){
    h += '<button class="chip' + (A.reps === r[0] ? ' sel' : '') + '" data-r="' + r[0] + '">' + r[1] + '</button>';
  });
  h += '</div><button class="go" data-act="autogo"' + (n ? '' : ' disabled') + '>流しはじめる</button>' +
       '<p class="note">画面を消すと音が止まります（iPhoneの仕様）。' +
       '設定 → 画面表示と明るさ → 自動ロック を「なし」にしておくと途切れません。' +
       '終わったら戻すのを忘れずに。</p>';
  app.innerHTML = h;
}
function autoRender(){
  var it = A.q[A.i];
  if(!it || !it.filled) return;
  var f = it.filled;
  head.textContent = "自動再生";
  backBtn.className = "";
  var h = '<div class="prog"><b>' + pad(A.i + 1) + ' / ' + pad(A.q.length) + '　' + A.lap + '周目</b>' +
          '<span class="ticks"><i class="' + (A.phase === "ja" ? "now" : "done") + '"></i>' +
          '<i class="' + (A.phase === "en" ? "now" : "") + '"></i></span></div>' +
          '<div class="tag">' + esc(it.src) + '</div>' +
          '<p class="q">' + esc(f.jp) + '</p>' +
          '<p class="en" style="opacity:' + (A.phase === "en" ? "1" : ".12") + ';transition:opacity .3s">' +
          esc(f.en) + '</p>';
  if(f.why) h += '<div class="why" style="opacity:' + (A.phase === "en" ? "1" : ".2") + '">' + rich(f.why) + '</div>';
  h += '<div class="judge" style="margin-top:28px">' +
       '<button class="j3" data-act="' + (A.paused ? "autoresume" : "autopause") + '"><b>' +
       (A.paused ? "▶" : "❙❙") + '</b>' + (A.paused ? "再開" : "一時停止") + '</button>' +
       '<button class="j3" data-act="autoskip"><b>▶▶</b>次へ</button>' +
       '<button class="j3" data-act="autoend"><b>■</b>やめる</button>' +
       '</div>';
  app.innerHTML = h;
}

/* ---- 記録を見る ---- */
function histView(){
  S.screen = "hist"; S.back = "home"; S.wipe = false;
  head.textContent = "記録";
  backBtn.className = "";
  var lg = loadLog();
  if(!lg.length){
    app.innerHTML = '<h1>記録</h1><p class="lead">まだ何も入っていない。' +
      '1セット終えると、その結果がここに残ります。</p>' +
      '<button class="ghost" data-go="home">ホーム</button>';
    return;
  }
  var tot = lg.reduce(function(a, s2){ return a + s2.tot; }, 0);
  var one = lg.reduce(function(a, s2){ return a + s2.n1; }, 0);
  var h = '<h1>記録</h1><p class="lead">' + lg.length + 'セット ／ 通算 ' + tot + '問 ／ 1秒合格 ' +
          Math.round(one / Math.max(1, tot) * 100) + '%</p>';

  var w = weakness(lg).slice(0, 12);
  if(w.length){
    h += '<div class="sect">繰り返し落ちているユニット</div><div class="miss">';
    w.forEach(function(x){
      h += '<div><span style="font-family:var(--sans);font-size:14px;color:var(--ink)">' + esc(x.label) +
           '</span><span>' + x.miss + ' / ' + x.seen + '　' + Math.round(x.rate * 100) + '%</span></div>';
    });
    h += '</div>';
  }

  h += '<div class="sect">セット履歴（新しい順）</div><div class="miss">';
  lg.slice().reverse().slice(0, 25).forEach(function(s2){
    h += '<div><span style="font-family:var(--sans);font-size:14px;color:var(--ink)">' + esc(s2.d) +
         '<br><span style="font-size:11.5px;color:var(--dim2)">' + esc(s2.range) + '</span></span>' +
         '<span>' + s2.n1 + ' / ' + s2.n3 + ' / ' + s2.nx + '</span></div>';
  });
  h += '</div><div class="sp"></div>' +
       '<button class="ghost" data-go="hrec">Markdownで書き出す</button>' +
       '<button class="ghost" data-act="wipe" style="color:#f5b8c1;border-color:#4a2b31">' +
       (S.wipe ? '本当に全部消す' : '記録を全部消す') + '</button>' +
       '<button class="ghost" data-go="home">ホーム</button>';
  app.innerHTML = h;
}

/* ---- 遷移 ---- */
function go(name){
  if(name === "home") home();
  else if(name === "unit") unitFilter();
  else if(name === "record") recordView(false);
  else if(name === "hrec") recordView(true);
  else if(name === "hist") histView();
  else if(name === "auto") autoSetup();
  else if(name === "result") result();
  else if(name === "start"){
    if(S.presetId === "weak"){ start(items(S.units), "苦手だけ"); return; }
    var p = PRESETS.filter(function(x){ return x.id === S.presetId; })[0];
    start(items(S.units), p ? p.label : "個別選択");
  }
}

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("button") : null;
  if(!t) return;

  if(t.id === "snd"){
    SND = !SND;
    sndBtn.className = SND ? "on" : "";
    if(!SND && "speechSynthesis" in window) speechSynthesis.cancel();
    return;
  }
  if(t.id === "back"){
    autoHalt();
    if("speechSynthesis" in window) speechSynthesis.cancel();
    go(S.back || "home"); return;
  }
  if(t.dataset.go){ go(t.dataset.go); return; }

  if(t.dataset.p){
    if(t.dataset.p === "weak"){
      var wu = weakUnits();
      if(wu.length){ S.presetId = "weak"; S.units = wu; }
      home(); return;
    }
    var pr = PRESETS.filter(function(x){ return x.id === t.dataset.p; })[0];
    if(pr){ S.presetId = pr.id; S.units = pr.units.slice(); }
    home(); return;
  }
  if(t.dataset.l){ S.limit = parseInt(t.dataset.l, 10); home(); return; }
  if(t.dataset.v){
    if(t.dataset.v === "ja") JASND = !JASND; else SND = !SND;
    sndBtn.className = SND ? "on" : "";
    if(hasTTS()) speechSynthesis.cancel();
    home(); return;
  }
  if(t.dataset.all){
    S.units = t.dataset.all === "1" ? ALL.slice() : [];
    S.presetId = "custom"; unitFilter(); return;
  }
  if(t.dataset.u){
    var i = S.units.indexOf(t.dataset.u);
    if(i >= 0) S.units.splice(i, 1); else S.units.push(t.dataset.u);
    S.presetId = "custom"; unitFilter(); return;
  }

  var a = t.dataset.act;
  if(t.dataset.g){ A.gap = parseInt(t.dataset.g, 10); autoSetup(); return; }
  if(t.dataset.r){ A.reps = parseInt(t.dataset.r, 10); autoSetup(); return; }
  if(a === "autogo"){
    S.screen = "auto"; S.back = "home";
    A.q = shuffle(items(S.units)); A.i = 0; A.lap = 1;
    A.on = true; A.paused = false;
    autoStep(); return;
  }
  if(a === "autopause"){ A.paused = true; A.tok++; if(A.timer) clearTimeout(A.timer);
                         if(hasTTS()) speechSynthesis.cancel(); autoRender(); return; }
  if(a === "autoresume"){ A.paused = false; autoStep(); return; }
  if(a === "autoskip"){ A.tok++; if(A.timer) clearTimeout(A.timer);
                        if(hasTTS()) speechSynthesis.cancel(); A.paused = false; A.i++; autoStep(); return; }
  if(a === "autoend"){ autoHalt(); home(); return; }
  if(a === "replay"){
    var it2 = S.queue[S.i];
    if(it2 && it2.filled) speakJa(it2.filled.jp, function(){ S.t0 = Date.now(); });
    return;
  }
  if(a === "show"){ S.shown = true; quiz(); return; }
  if(a === "j1"){ judge("1"); return; }
  if(a === "j3"){ judge("3"); return; }
  if(a === "jx"){ judge("x"); return; }
  if(a === "again"){
    S.queue = shuffle(S.miss);
    S.queue.forEach(function(x){ x.filled = null; x.mark = null; });
    S.i = 0; S.shown = false; S.miss = []; S.n1 = 0; S.n3 = 0; S.nx = 0; S.round++;
    quiz(); return;
  }
  if(a === "same"){ go("start"); return; }
  if(a === "wipe"){
    if(!S.wipe){ S.wipe = true; t.textContent = "本当に全部消す"; return; }
    try{ localStorage.removeItem(LSKEY); }catch(e){}
    S.wipe = false; histView(); return;
  }
  if(a === "copy"){
    var ta = document.getElementById("rec");
    ta.removeAttribute("readonly");
    ta.select(); ta.setSelectionRange(0, 99999);
    var done = false;
    try{ done = document.execCommand("copy"); }catch(e){}
    ta.setAttribute("readonly", "readonly");
    if(navigator.clipboard && !done){
      navigator.clipboard.writeText(ta.value).then(function(){ t.textContent = "コピーした"; });
    }
    t.textContent = done ? "コピーした" : "選択したので手動でコピー";
    return;
  }
});

sndBtn.className = "on";
home();
</script>
